name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            cc: gcc
            cxx: g++
            preset: debug
          - name: GCC Release
            cc: gcc
            cxx: g++
            preset: release
          - name: Clang Debug
            cc: clang
            cxx: clang++
            preset: debug
          - name: Clang ASan
            cc: clang
            cxx: clang++
            preset: asan
          - name: Clang UBSan
            cc: clang
            cxx: clang++
            preset: ubsan

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build clang

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  deb-package:
    name: Ubuntu DEB package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and packaging tools
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          ninja-build pkg-config libsystemd-dev dpkg-dev groff zsh fish

      - name: Configure package build
        run: cmake --preset package-release

      - name: Build package configuration
        run: cmake --build --preset package-release

      - name: Test installed layout and DEB
        run: ctest --preset package-release

      - name: Create DEB
        run: cpack --config build/package-release/CPackConfig.cmake -G DEB

      - name: Upload DEB and checksum
        uses: actions/upload-artifact@v4
        with:
          name: lx-resource-manager-deb
          path: build/package-release/packages/*
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            cc: gcc
            cxx: g++
            preset: debug
          - name: GCC Release
            cc: gcc
            cxx: g++
            preset: release
          - name: Clang Debug
            cc: clang
            cxx: clang++
            preset: debug
          - name: Clang ASan
            cc: clang
            cxx: clang++
            preset: asan
          - name: Clang UBSan
            cc: clang
            cxx: clang++
            preset: ubsan

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build clang

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  compatibility:
    name: ${{ matrix.name }} compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: deb
          - name: Debian 13
            image: debian:13
            family: deb
            systemd: "OFF"
          - name: Rocky Linux 8
            image: rockylinux:8
            family: rpm
          - name: AlmaLinux 9
            image: almalinux:9
            family: rpm
          - name: Ubuntu 22.04 extended
            image: ubuntu:22.04
            family: deb
            extended: true
          - name: Ubuntu 26.04 extended
            image: ubuntu:26.04
            family: deb
            extended: true
          - name: Debian 12 extended
            image: debian:12
            family: deb
            extended: true
          - name: Rocky Linux 9 extended
            image: rockylinux:9
            family: rpm
            extended: true
          - name: AlmaLinux 8 extended
            image: almalinux:8
            family: rpm
            extended: true
          - name: Fedora extended
            image: fedora:latest
            family: rpm
            extended: true
    container: ${{ matrix.image }}
    env:
      LX_COMPAT_SYSTEMD: ${{ matrix.systemd || 'ON' }}
    steps:
      - name: Install Debian-family build tools
        if: matrix.family == 'deb' && (!matrix.extended || github.event_name == 'schedule')
        run: >-
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --yes
          ca-certificates cmake g++ git ninja-build pkg-config libsystemd-dev

      - name: Install RPM-family build tools
        if: matrix.family == 'rpm' && (!matrix.extended || github.event_name == 'schedule')
        run: >-
          dnf install --assumeyes
          ca-certificates cmake gcc-c++ git ninja-build pkgconf-pkg-config systemd-devel

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ !matrix.extended || github.event_name == 'schedule' }}

      - name: Configure
        if: ${{ !matrix.extended || github.event_name == 'schedule' }}
        run: >-
          cmake -S . -B build/compat -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DLX_ENABLE_HARDENING=ON
          -DLX_BUILD_TESTS=ON -DLX_BUILD_TUI=OFF
          -DLX_ENABLE_SYSTEMD=${LX_COMPAT_SYSTEMD}

      - name: Build and test
        if: ${{ !matrix.extended || github.event_name == 'schedule' }}
        run: cmake --build build/compat && ctest --test-dir build/compat --output-on-failure

  deb-package:
    name: Ubuntu 22.04 DEB package and lifecycle
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Install build and packaging tools
        run: >-
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --yes
          ca-certificates cmake g++ git ninja-build pkg-config libsystemd-dev
          dpkg-dev groff zsh fish

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure package build
        run: cmake --preset package-release

      - name: Build package configuration
        run: cmake --build --preset package-release

      - name: Test installed layout and DEB
        run: ctest --preset package-release

      - name: Create DEB
        run: cpack --config build/package-release/CPackConfig.cmake -G DEB

      - name: Build synthetic old DEB
        run: >-
          cmake -S . -B build/package-old -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLX_BUILD_TUI=ON -DLX_BUILD_TESTS=OFF -DLX_ENABLE_HARDENING=ON
          -DLX_DISPLAY_VERSION=0.0.0 -DLX_PACKAGE_VERSION=0.0.0
          && cmake --build build/package-old
          && cpack --config build/package-old/CPackConfig.cmake -G DEB

      - name: Test DEB upgrade and removal
        run: >-
          cmake
          -DLX_PACKAGE_MANAGER=apt
          -DLX_OLD_PACKAGE=${{ github.workspace }}/build/package-old/packages/lx-resource-manager_0.0.0_amd64.deb
          -DLX_CURRENT_PACKAGE=${{ github.workspace }}/build/package-release/packages/lx-resource-manager_0.1.0_amd64.deb
          -DLX_OLD_VERSION=0.0.0 -DLX_CURRENT_VERSION=0.1.0
          -P cmake/PackageLifecycleTest.cmake

      - name: Upload DEB and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lx-resource-manager-deb
          path: build/package-release/packages/*
          if-no-files-found: error

  rpm-package:
    name: Rocky Linux 8 RPM package and lifecycle
    runs-on: ubuntu-24.04
    container: rockylinux:8
    steps:
      - name: Install build and packaging tools
        run: >-
          dnf install --assumeyes ca-certificates cmake gcc-c++ git ninja-build
          pkgconf-pkg-config systemd-devel rpm-build rpm

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure and build current RPM
        run: cmake --preset package-release && cmake --build --preset package-release

      - name: Test installed layout and RPM
        run: ctest --preset package-release

      - name: Create current RPM
        run: cpack --config build/package-release/CPackConfig.cmake -G RPM

      - name: Build synthetic old RPM
        run: >-
          cmake -S . -B build/package-old -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLX_BUILD_TUI=ON -DLX_BUILD_TESTS=OFF -DLX_ENABLE_HARDENING=ON
          -DLX_DISPLAY_VERSION=0.0.0 -DLX_PACKAGE_VERSION=0.0.0
          && cmake --build build/package-old
          && cpack --config build/package-old/CPackConfig.cmake -G RPM

      - name: Test RPM upgrade and removal
        run: >-
          cmake
          -DLX_PACKAGE_MANAGER=dnf
          -DLX_OLD_PACKAGE=${{ github.workspace }}/build/package-old/packages/lx-resource-manager-0.0.0-1.x86_64.rpm
          -DLX_CURRENT_PACKAGE=${{ github.workspace }}/build/package-release/packages/lx-resource-manager-0.1.0-1.x86_64.rpm
          -DLX_OLD_VERSION=0.0.0 -DLX_CURRENT_VERSION=0.1.0
          -P cmake/PackageLifecycleTest.cmake

      - name: Upload RPM and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lx-resource-manager-rpm
          path: build/package-release/packages/*
          if-no-files-found: error

  benchmarks:
    name: Release benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build libsystemd-dev

      - name: Build benchmarks
        run: cmake --preset benchmark-release && cmake --build --preset benchmark-release

      - name: Run benchmarks
        run: >-
          build/benchmark-release/benchmarks/lx_benchmarks
          --benchmark_out=build/benchmark-release/phase10b-benchmarks.json
          --benchmark_out_format=json

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lx-phase10b-benchmarks
          path: build/benchmark-release/phase10b-benchmarks.json
          if-no-files-found: error

  ubi-runtime:
    name: UBI ${{ matrix.major }} RPM runtime
    if: github.event_name == 'schedule'
    needs: rpm-package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        major: [8, 9]
    container: registry.access.redhat.com/ubi${{ matrix.major }}/ubi
    steps:
      - name: Install artifact tools
        run: dnf install --assumeyes gzip tar

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lx-resource-manager-rpm
          path: packages

      - name: Install and verify RPM
        run: >-
          dnf install --assumeyes packages/*.rpm
          && lx --version
          && lx doctor --no-color
          && lx status --json

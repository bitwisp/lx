name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            cc: gcc
            cxx: g++
            preset: debug
          - name: GCC Release
            cc: gcc
            cxx: g++
            preset: release
          - name: Clang Debug
            cc: clang
            cxx: clang++
            preset: debug
          - name: Clang ASan
            cc: clang
            cxx: clang++
            preset: asan
          - name: Clang UBSan
            cc: clang
            cxx: clang++
            preset: ubsan

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build clang

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

